name: Release

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/release.yml'

permissions:
  contents: write

# Serialize releases so two pushes don't race to compute the same next tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a token that can push tags. The default GITHUB_TOKEN works
          # because we set `permissions.contents: write` above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --quiet
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          BASE="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEXT_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          NEW_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          echo "Latest tag: $LATEST"
          echo "Next tag:   $NEW_TAG"
          echo "VERSION_NAME=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"
          echo "version_name=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Push new tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage release artifacts
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk \
             "release-assets/watchbridge-${VERSION_NAME}.apk"
          cp scripts/install.sh release-assets/
          cp scripts/install.bat release-assets/

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            "release-assets/watchbridge-${VERSION_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: WatchBridge ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/watchbridge-*.apk
            release-assets/install.sh
            release-assets/install.bat
